worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    log_format safe_json '{"timestamp":"$time_iso8601","level":"info","method":"$request_method","status":$status,"duration":$request_time,"requestId":"$upstream_http_x_request_id"}';
    access_log /dev/stdout safe_json;
    server_tokens off;
    sendfile on;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;
    upstream api_backend {
        zone api_backend 64k;
        server backend:8080 resolve;
    }
    server {
        listen 8080;
        root /usr/share/nginx/html;
        client_max_body_size 1m;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        location = /health/live { access_log off; default_type text/plain; return 200 'alive'; }
        location /api/ {
            proxy_pass http://api_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_connect_timeout 5s;
            proxy_read_timeout 35s;
            proxy_send_timeout 20s;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Referrer-Policy;
        }
        location /assets/ {
            try_files $uri =404;
            expires 1y;
            # expires adds Cache-Control; keep other security headers inherited.
            gzip on;
            gzip_types application/javascript text/css image/svg+xml;
        }
        location / {
            expires -1;
            try_files $uri $uri/ /index.html;
        }
    }
}
